version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mediexplain-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mediexplain-network
    restart: unless-stopped

  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: mediexplain-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mediexplain
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=production_strong_key_32_chars_long_minimum_value
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - mediexplain-network
    restart: unless-stopped

  frontend:
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: mediexplain-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mediexplain-network
    restart: unless-stopped

volumes:
  mongodb_data:
  backend_uploads:

networks:
  mediexplain-network:
    driver: bridge
